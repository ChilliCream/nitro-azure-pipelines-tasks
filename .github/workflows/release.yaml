name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Nitro CLI version to bind this extension to (X.Y.Z).
        required: true
        type: string

run-name: "🚀 Release ${{ inputs.version }}"

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/update-cli-version.yaml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
