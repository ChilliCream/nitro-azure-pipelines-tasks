name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Nitro CLI version to bind this extension to.
        required: true
        type: string
      is_active_major:
        description: Whether this version targets the top lane (cli.major >= highest stable major).
        required: true
        type: boolean

run-name: "🚀 Release ${{ inputs.version }}"

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/update-cli-version.yaml
    with:
      version: ${{ inputs.version }}
      is_active_major: ${{ inputs.is_active_major }}
    secrets: inherit
