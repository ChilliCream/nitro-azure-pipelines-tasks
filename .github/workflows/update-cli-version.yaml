name: 🔄 Update Nitro CLI Version (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: Nitro CLI version to bind this extension to (X.Y.Z).
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest

    outputs:
      publish: ${{ steps.lane.outputs.publish }}
      lane: ${{ steps.lane.outputs.lane }}

    steps:
      - name: 🛣️ Resolve lane
        id: lane
        uses: actions/github-script@v9
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const version = process.env.VERSION;
            const { owner, repo } = context.repo;

            const parse = (v) => {
              const m = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(v);
              return m && [+m[1], +m[2], +m[3]];
            };
            const compare = (a, b) => a.map((x, i) => x - b[i]).find((d) => d) ?? 0;
            const refs = (prefix) => github.paginate(github.rest.git.listMatchingRefs, { owner, repo, ref: prefix, per_page: 100 });

            const v = parse(version);
            if (!v) {
              throw new Error(`Version '${version}' is not X.Y.Z.`);
            }
            const [major, minor] = v;
            const lane = `release/v${major}.${minor}`;

            // Only published builds are tagged, so the highest vX.Y.Z tag is what is live on the Marketplace.
            const highest = (await refs('tags/v'))
              .map((r) => parse(r.ref.slice('refs/tags/v'.length)))
              .filter((t) => t)
              .reduce((max, t) => (!max || compare(t, max) > 0 ? t : max), undefined);
            if (highest && compare(v, highest) <= 0) {
              core.notice(`${version} is not higher than v${highest.join('.')}; Marketplace unchanged.`);
              core.setOutput('publish', 'false');
              return;
            }

            const branches = await refs(`heads/release/v${major}.`);
            const branch = (m) => branches.find((r) => r.ref === `refs/heads/release/v${major}.${m}`);

            if (!branch(minor)) {
              // Cut from the nearest lower lane's tip in the same major. New majors are cut by hand.
              let base;
              for (let m = minor - 1; !base && m >= 0; m--) {
                base = branch(m)?.object.sha;
              }
              if (!base) {
                throw new Error(`No lower lane for ${lane} in major ${major}. A new major is cut by hand.`);
              }
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${lane}`, sha: base });
                core.info(`Created ${lane} at ${base}.`);
              } catch (e) {
                if (e.status !== 422) throw e;
                core.info(`${lane} was created concurrently.`);
              }
            }

            core.setOutput('publish', 'true');
            core.setOutput('lane', lane);

  release:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      LANE: ${{ needs.resolve.outputs.lane }}

    steps:
      - name: 📥 Checkout lane
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.lane }}
          fetch-depth: 0
          persist-credentials: false

      - name: 📍 Record lane HEAD
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 🧰 Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.2.2 --activate
          yarn --version

      - name: 🧰 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 📝 Bump versions
        run: yarn bump "$VERSION"

      - name: 📝 Set extension version
        run: |
          node -e '
            const fs = require("node:fs");
            for (const file of ["vss-extension.json", "package.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = process.env.VERSION;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
          '

      - name: 🏗️ Build
        run: yarn build

      - name: 📦 Package extension
        run: yarn package

      - name: 📤 Sign commit
        id: commit
        uses: ChilliCream/create-signed-commit@d84f4dbc5b941e36c5b6a81d631d7ebb2f26128a
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "Update Nitro CLI to ${{ inputs.version }}"
          branch: ${{ needs.resolve.outputs.lane }}

      - name: 📤 Publish to Visual Studio Marketplace
        env:
          TFX_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          PUBLISHER: ${{ secrets.MARKETPLACE_PUBLISHER }}
        run: |
          set -euo pipefail
          VSIX=$(ls artifacts/*.vsix | head -n1)
          if [[ -z "$VSIX" ]]; then
            echo "::error::No .vsix produced by 'yarn package'."
            exit 1
          fi
          yarn tfx extension publish \
            --vsix "$VSIX" \
            --publisher "$PUBLISHER" \
            --token "$TFX_TOKEN" \
            --no-color

      - name: 🏷️ Sign tag
        uses: ChilliCream/create-signed-tag@305574048e9b917846aa93aa8b23ba258533dd7e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ inputs.version }}
          sha: ${{ steps.commit.outputs.sha || steps.head.outputs.sha }}
          force: "false"

      - name: 🚀 Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading .vsix to existing release."
            gh release upload "$TAG" artifacts/*.vsix --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Nitro CLI ${VERSION}" \
              --latest=true \
              --verify-tag \
              artifacts/*.vsix
          fi
